<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garcia Topografia — Sistema</title>
<meta http-equiv="refresh" content="0; url=dashboard.html">
<link rel="canonical" href="dashboard.html">
<style>
  html,body{margin:0;height:100%;font-family:'Inter',system-ui,sans-serif;background:#1E3A5F;color:#E2E8F0;}
  .splash{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
  .splash img{height:40px;background:#fff;border-radius:10px;padding:8px 14px;}
  .splash .dots{display:flex;gap:6px;}
  .splash .dots i{width:8px;height:8px;border-radius:50%;background:#F97316;animation:b 1s infinite ease-in-out;}
  .splash .dots i:nth-child(2){animation-delay:.15s;} .splash .dots i:nth-child(3){animation-delay:.3s;}
  @keyframes b{0%,80%,100%{opacity:.3;transform:scale(.8);}40%{opacity:1;transform:scale(1);}}
  .splash a{color:#94A3B8;font-size:13px;text-decoration:underline;}
</style>
</head>
<body>
  <div class="splash">
    <img src="logo-garcia.png" alt="Garcia Topografia">
    <div class="dots"><i></i><i></i><i></i></div>
    <a href="dashboard.html">Abrir o sistema</a>
  </div>
  <script>location.replace('dashboard.html');</script>
</body>
</html>
